services:
  web:
    build: .
    image: global-civil-api-catalog-web:local
    container_name: global-civil-api-catalog-web
    ports:
      - "127.0.0.1:49231:8080"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

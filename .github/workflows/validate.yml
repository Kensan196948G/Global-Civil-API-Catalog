name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff mypy pip-audit
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Type check (mypy)
        run: python -m mypy web scripts db
      - name: Compile Python
        run: python -m compileall scripts tests
      - name: Validate catalog
        run: python scripts/validate_catalog.py
      - name: Run tests
        run: python -m pytest
      - name: Dependency security scan (pip-audit)
        run: python -m pip_audit
      - name: Export artifacts
        run: python scripts/export_markdown.py

  db-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:14-3.4
        env:
          POSTGRES_USER: catalog
          POSTGRES_PASSWORD: catalog_ci_test
          POSTGRES_DB: catalog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catalog -d catalog"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install DB dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[db]" pytest
      - name: Enable PostGIS
        env:
          CATALOG_DATABASE_URL: postgresql+psycopg://catalog:catalog_ci_test@127.0.0.1:5432/catalog
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          engine = create_engine(
              "postgresql+psycopg://catalog:catalog_ci_test@127.0.0.1:5432/catalog"
          )
          with engine.begin() as conn:
              conn.execute(text("CREATE EXTENSION IF NOT EXISTS postgis"))
          PY
      - name: Apply migrations
        env:
          CATALOG_DATABASE_URL: postgresql+psycopg://catalog:catalog_ci_test@127.0.0.1:5432/catalog
        run: python -m alembic upgrade head
      - name: Seed database from JSON catalog
        env:
          CATALOG_DATABASE_URL: postgresql+psycopg://catalog:catalog_ci_test@127.0.0.1:5432/catalog
        run: python scripts/migrate_json_to_db.py
      - name: Run DB-backed test suites
        env:
          CATALOG_DATABASE_URL: postgresql+psycopg://catalog:catalog_ci_test@127.0.0.1:5432/catalog
        run: |
          python -m pytest \
            tests/test_db_phase_a.py \
            tests/test_auth_rbac.py \
            tests/test_workflow_audit.py \
            tests/test_local_auth.py

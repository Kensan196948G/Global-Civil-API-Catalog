name: scheduled-verify
on:
  schedule:
    - cron: "0 2 * * 1" # 毎週月曜 02:00 UTC
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run live API verification
        run: python scripts/run_verification.py --live --write --limit 50 --timeout 15
      - name: Update scores
        run: python scripts/score_catalog.py --write
      - name: Refresh catalog metadata counts
        run: python scripts/refresh_catalog_metadata.py --write
      - name: Export artifacts
        run: python scripts/export_markdown.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ export/ samples/
          if ! git diff --staged --quiet; then
            git commit -m "chore: weekly verification $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi

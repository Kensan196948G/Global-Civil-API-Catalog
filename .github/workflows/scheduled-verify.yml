name: scheduled-verify
on:
  schedule:
    - cron: "0 2 * * 1" # 毎週月曜 02:00 UTC
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff
      - name: Run live API verification
        run: python scripts/run_verification.py --live --write --limit 50 --timeout 15
      - name: Update scores
        run: python scripts/score_catalog.py --write
      - name: Refresh catalog metadata counts
        run: python scripts/refresh_catalog_metadata.py --write
      - name: Export artifacts
        run: python scripts/export_markdown.py
      - name: Open PR if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ export/ samples/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            curl -sS -X POST \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
              -d '{"state":"success","context":"catalog","description":"Weekly verification: no catalog changes"}'
            exit 0
          fi
          DATE="$(date -u +%Y-%m-%d)"
          BRANCH="chore/weekly-verification-${DATE}-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git commit -m "chore: weekly verification ${DATE}"
          HEAD_SHA="$(git rev-parse HEAD)"
          # Required checks on GITHUB_TOKEN-created PRs never trigger, so run
          # the same gates here and post a commit status under the required
          # "catalog" context (issue #72).
          if python scripts/validate_catalog.py && python -m ruff check . && python -m pytest; then
            STATE=success
            DESC="catalog validation, lint and tests passed"
          else
            STATE=failure
            DESC="weekly verification pipeline failed"
          fi
          git push origin "$BRANCH"
          # The status must be posted after the push: GitHub rejects statuses
          # for SHAs it does not know yet ("No commit found for SHA").
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${HEAD_SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"catalog\",\"description\":\"${DESC}\"}"
          # Compose the multi-line PR body with printf; embedding a literal
          # multi-line string here previously broke out of the YAML block
          # scalar (an unindented continuation line became a top-level key,
          # invalidating the whole workflow file on the GitHub side).
          BODY="$(printf '%s\n\n%s' \
            "Automated weekly catalog verification (scheduled-verify workflow). Updates data/, export/, samples/ only." \
            "The \`catalog\` required check is satisfied by the commit status posted from this workflow (issue #72).")"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: weekly verification ${DATE}" \
            --body "$BODY"
      - name: Create alert issue on verification failures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f data/verification_results.json ]; then
            echo "verification_results.json missing; skipping alert."
            exit 0
          fi
          python - <<'PY'
          import json
          results = json.load(open("data/verification_results.json", encoding="utf-8"))
          failures = [
              {
                  "api_id": r["api_id"],
                  "verified_at": r.get("verified_at"),
                  "note": r.get("note") or r.get("error_message") or "",
              }
              for r in results
              if r.get("result") == "failure"
          ]
          with open("verification_alerts.json", "w", encoding="utf-8") as fh:
              json.dump({"date": __import__("datetime").date.today().isoformat(), "failures": failures}, fh, ensure_ascii=False, indent=2)
          PY
          if python -c "import json; d=json.load(open('verification_alerts.json')); exit(0 if d['failures'] else 1)"; then
            OPEN="$(gh issue list --label verification-alert --state open --json number --jq 'length')"
            if [ "$OPEN" = "0" ]; then
              gh issue create \
                --title "週次検証 failure 検出 ($(date -u +%Y-%m-%d))" \
                --label verification-alert \
                --body "$(cat verification_alerts.json)"
            else
              echo "verification-alert issue already open ($OPEN); skipping."
            fi
          else
            echo "No verification failures to report."
          fi

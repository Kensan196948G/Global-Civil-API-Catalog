[project]
name = "global-civil-api-catalog"
version = "0.1.0"
description = "Catalog and verification toolkit for civil engineering public APIs and open data."
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[project]
name = "global-civil-api-catalog"
version = "0.1.0"
description = "Catalog and verification toolkit for civil engineering public APIs and open data."
requires-python = ">=3.12"
dependencies = []

# Phase A (epic #46): the DB/API layer is opt-in during the dual-run
# period — the shipped static site and batch scripts stay stdlib-only.
[project.optional-dependencies]
db = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[project]
name = "global-civil-api-catalog"
version = "1.3.0"
description = "Catalog and verification toolkit for civil engineering public APIs and open data."
requires-python = ">=3.12"
dependencies = []

# Phase A (epic #46): the DB/API layer is opt-in during the dual-run
# period — the shipped static site and batch scripts stay stdlib-only.
[project.optional-dependencies]
db = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "authlib>=1.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not e2e'"
markers = [
    "e2e: browser end-to-end tests (run explicitly with -m e2e)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["web/Global Civil API Catalog\\.html", "migrations/versions"]

[tool.setuptools.packages.find]
where = ["."]
include = ["db*", "web*", "scripts*"]
